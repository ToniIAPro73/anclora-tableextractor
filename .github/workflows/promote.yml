name: Promote / Environment

# Manual, human-gated promotion. Moves the target branch to the exact SHA
# already validated upstream. Fast-forward only: no merge, rebase, cherry-pick,
# or force push.
#
# development -> staging -> production -> main

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to promote into"
        required: true
        type: choice
        options: [staging, production, main]

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source branch
        id: source
        run: |
          case "${{ inputs.target }}" in
            staging) echo "branch=development" >> "$GITHUB_OUTPUT" ;;
            production) echo "branch=staging" >> "$GITHUB_OUTPUT" ;;
            main) echo "branch=production" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify fast-forward safety
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.source.outputs.branch }}" "${{ inputs.target }}"
          SOURCE_SHA="$(git rev-parse "origin/${{ steps.source.outputs.branch }}")"
          TARGET_SHA="$(git rev-parse "origin/${{ inputs.target }}")"
          echo "Source (${{ steps.source.outputs.branch }}): $SOURCE_SHA"
          echo "Target (${{ inputs.target }}): $TARGET_SHA"
          echo "source=$SOURCE_SHA" >> "$GITHUB_ENV"
          if [ "$SOURCE_SHA" = "$TARGET_SHA" ]; then
            echo "Already at target SHA. Nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
            echo "::error::PROMOTION_BLOCKED_DIVERGENCE: target contains commits not present in source."
            exit 1
          fi

      - name: Verify source CI workflow success
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$source&per_page=100")"
          SUCCESSFUL_RUNS="$(printf '%s' "$RUNS_JSON" | jq --arg sha "$source" '[.workflow_runs[] | select(.name == "CI / Development" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length')"
          echo "Successful CI / Development runs for $source: $SUCCESSFUL_RUNS"
          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "::error::PROMOTION_BLOCKED_CI_NOT_GREEN: no completed successful CI / Development run exists for the exact source SHA."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fast-forward target ref
        run: git push origin "$source:refs/heads/${{ inputs.target }}"
