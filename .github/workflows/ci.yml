name: CI / Development

on:
  push:
    branches: [development, staging, production]
  pull_request:
    branches: [development, staging, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Tests
        run: yarn test --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: yarn build

  backend:
    name: Backend Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pytest-xdist requests

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Collect backend tests
        working-directory: backend
        run: python -m pytest --collect-only -q
